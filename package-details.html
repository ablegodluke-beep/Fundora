<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package Details | Fundora</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080b18;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 85px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid #20253b;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: bold;
}

.logo img {
    width: 34px;
    height: 34px;
    object-fit: contain;
}

.back {
    color: #b69cff;
    text-decoration: none;
    font-size: 13px;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 28px 16px;
}

.package-card {
    background: linear-gradient(145deg,#34206f,#172d63,#101a36);
    border: 1px solid #55418f;
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    margin-bottom: 22px;
}

.package-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 17px;
    border-radius: 17px;
    background: linear-gradient(135deg,#743bff,#258cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
}

.package-card small {
    color: #c0aaff;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.package-card h1 {
    font-size: 23px;
    margin: 12px 0;
}

.amount {
    font-size: 34px;
    font-weight: bold;
    margin-top: 15px;
}

.trust-section {
    background: #12172a;
    border: 1px solid #292e45;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 22px;
}

.trust-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 0;
    border-bottom: 1px solid #252b40;
}

.trust-item:last-child {
    border-bottom: none;
}

.trust-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #282044;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.trust-item h3 {
    font-size: 14px;
    margin-bottom: 5px;
}

.trust-item p {
    color: #9299b1;
    font-size: 11px;
}

.buy-button {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(100deg,#743bff,#287cff);
    color: white;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
}

.payment-note {
    color: #858ca7;
    font-size: 11px;
    text-align: center;
    margin-top: 12px;
    line-height: 1.5;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #101426;
    border-top: 1px solid #292e45;
    display: flex;
    justify-content: space-around;
    padding: 11px 3px;
}

.bottom-nav a {
    text-decoration: none;
    color: #858ca7;
    font-size: 10px;
    text-align: center;
}

.bottom-nav a span {
    display: block;
    font-size: 19px;
    margin-bottom: 4px;
}

.bottom-nav a.active {
    color: #a98cff;
}
</style></head><body><header>
    <div class="logo">
        <img src="fundora-logo.png" alt="Fundora">
        <span>Fundora</span>
    </div><a href="packages.html" class="back">← Packages</a>

</header><main class="container"><section class="package-card">
    <div class="package-icon" id="packageIcon">🌱</div>
    <small id="packageLabel">Starter Package</small>
    <h1 id="packageTitle">Package Details</h1>
    <div class="amount" id="packageAmount">₦3,000</div>
</section>

<section class="trust-section">

    <div class="trust-item">
        <div class="trust-icon">🏆</div>
        <div>
            <h3>4 Years of Experience</h3>
            <p>Four years of building and growing.</p>
        </div>
    </div>

    <div class="trust-item">
        <div class="trust-icon">🤝</div>
        <div>
            <h3>Trusted by Many</h3>
            <p>A growing community built on trust.</p>
        </div>
    </div>

</section>

<button class="buy-button" id="buyButton" type="button">
    Buy Package
</button>

<p class="payment-note">
    Secure payment through Paystack will be available once payment integration is connected.
</p>

</main><nav class="bottom-nav">
    <a href="dashboard.html">
        <span>⌂</span>Home
    </a><a href="packages.html" class="active">
    <span>▦</span>Packages
</a>

</nav><script>
const packages = {
    3000: { name: "Starter", icon: "🌱" },
    5000: { name: "Basic", icon: "🌿" },
    8000: { name: "Basic Plus", icon: "⚡" },
    10000: { name: "Standard", icon: "💠" },
    15000: { name: "Standard Plus", icon: "💎" },
    20000: { name: "Advanced", icon: "🔷" },
    30000: { name: "Growth", icon: "🚀" },
    50000: { name: "Premium", icon: "⭐" },
    60000: { name: "Premium Plus", icon: "🌟" },
    80000: { name: "Elite", icon: "👑" },
    100000: { name: "Ultimate", icon: "🏆" }
};

const params = new URLSearchParams(window.location.search);
const amount = params.get("amount");
const selected = packages[amount];

if (selected) {
    const formattedAmount = "₦" + Number(amount).toLocaleString("en-NG");

    document.getElementById("packageIcon").textContent = selected.icon;
    document.getElementById("packageLabel").textContent = selected.name + " Package";
    document.getElementById("packageTitle").textContent = selected.name + " Package";
    document.getElementById("packageAmount").textContent = formattedAmount;

    document.getElementById("buyButton").addEventListener("click", function() {
        alert("Paystack payment is not connected yet. Your selected package is " + formattedAmount + ".");
    });

} else {
    document.getElementById("packageTitle").textContent = "Package Not Found";
    document.getElementById("packageAmount").textContent = "—";
    document.getElementById("packageLabel").textContent = "Please select a package";
    document.getElementById("buyButton").disabled = true;
    document.getElementById("buyButton").textContent = "Select a Valid Package";
}
</script></body>
</html>
