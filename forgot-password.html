<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b20">
<title>Forgot Password | Fundora</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at 80% 5%,#20205e 0,transparent 42%),#080b20;color:#f7f8ff;font-family:'DM Sans',Arial,sans-serif;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.topbar{height:75px;width:92%;max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.brand img{width:38px;height:38px;object-fit:contain}
.top-link{font-size:13px;color:#aab4d0}
.top-link a,.form-foot a{color:#c3a1ff;font-weight:700}
.card{width:min(460px,92%);margin:35px auto 50px;background:linear-gradient(145deg,#151e3b,#0e152c);border:1px solid #273354;border-radius:18px;padding:30px;box-shadow:0 25px 70px #0005}
h2{font-size:25px;margin-bottom:8px}
.sub{color:#aab4d0;font-size:13px;line-height:1.6;margin-bottom:25px}
.field{margin-bottom:20px}
label{display:block;font-size:12px;color:#dce2f6;font-weight:600;margin-bottom:8px}
input{width:100%;height:47px;border:1px solid #344263;background:#0b1228;color:white;border-radius:10px;padding:0 14px;outline:none;font-size:13px;font-family:inherit}
input:focus{border-color:#9461ff;box-shadow:0 0 0 3px #8d4dff20}
input::placeholder{color:#71809f}
button{width:100%;height:48px;border:0;border-radius:10px;background:linear-gradient(110deg,#963eff,#496eff);color:white;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
button:active{transform:scale(.99)}
.form-foot{text-align:center;color:#aab4d0;font-size:12px;margin-top:20px}
.notice{display:none;margin-top:15px;padding:12px;border:1px solid #4b6d8b;background:#1b3550;border-radius:9px;color:#d9f4ff;font-size:12px;line-height:1.6}
.notice.show{display:block}
.note{color:#8492b2;font-size:10px;line-height:1.6;text-align:center;margin-top:16px}
@media(max-width:480px){.card{padding:25px 20px;margin-top:25px}.topbar{height:68px}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html"><img src="fundora-logo.png" alt="">Fundora</a>
<div class="top-link"><a href="login.html">Login</a></div>
</header><main class="card">
<h2>Forgot Password</h2>
<p class="sub">Enter the email address linked to your account.</p><form id="resetForm">
<div class="field">
<label for="email">Email address</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
</div><button type="submit">Reset Password</button>

<div class="notice" id="notice" role="status"></div>
</form><div class="form-foot"><a href="login.html">← Back to Login</a></div>
<p class="note">Password reset will be activated after authentication is connected.</p>
</main><script>
document.getElementById('resetForm').addEventListener('submit',function(e){
e.preventDefault();
const notice=document.getElementById('notice');
notice.textContent='Password reset is not active yet.';
notice.classList.add('show');
});
</script></body>
</html>
