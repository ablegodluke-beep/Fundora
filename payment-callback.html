<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying Payment | Fundora</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080b18;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #11172b;
    border: 1px solid #252d49;
    border-radius: 20px;
    padding: 35px 25px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 25px;
    background: linear-gradient(90deg, #a855f7, #38bdf8);
    -webkit-background-clip: text;
    color: transparent;
}

.loader {
    width: 48px;
    height: 48px;
    border: 4px solid #29334f;
    border-top-color: #8b5cf6;
    border-radius: 50%;
    margin: 0 auto 22px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

h2 {
    font-size: 21px;
    margin-bottom: 12px;
}

p {
    color: #aab3ca;
    font-size: 14px;
    line-height: 1.7;
}

.message {
    margin-top: 15px;
}

button, .link {
    display: inline-block;
    margin-top: 22px;
    padding: 13px 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #7c3aed, #2563eb);
    color: white;
    text-decoration: none;
    font-weight: 700;
    cursor: pointer;
}

.hidden {
    display: none;
}
</style></head><body><div class="card">
    <div class="logo">Fundora</div><div class="loader" id="loader"></div>

<h2 id="heading">Verifying your payment</h2>

<p id="message">
    Please wait while we confirm your payment securely.
    Do not close this page.
</p>

<a href="dashboard.html" class="link hidden" id="dashboardLink">
    Go to Dashboard
</a>

<a href="login.html" class="link hidden" id="loginLink">
    Log In
</a>

</div><script type="module">
import { supabase } from "./supabase.js";

const heading = document.getElementById("heading");
const message = document.getElementById("message");
const loader = document.getElementById("loader");
const dashboardLink = document.getElementById("dashboardLink");
const loginLink = document.getElementById("loginLink");

function showError(text) {
    loader.classList.add("hidden");
    heading.textContent = "Payment verification failed";
    message.textContent = text;
    dashboardLink.classList.add("hidden");
}

async function verifyPayment() {
    const params = new URLSearchParams(window.location.search);

    const reference =
        params.get("reference") ||
        params.get("trxref");

    if (!reference) {
        showError("No payment reference was received. Please contact support if you have already paid.");
        return;
    }

    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
        loader.classList.add("hidden");
        heading.textContent = "Login required";
        message.textContent = "Your payment reference is available, but your session has expired. Please log in and contact support so your payment can be checked.";
        loginLink.classList.remove("hidden");
        return;
    }

    try {
        const response = await fetch("/api/verify-package-payment", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${data.session.access_token}`
            },
            body: JSON.stringify({ reference })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error || "We could not confirm your payment."
            );
        }

        heading.textContent = "Payment successful!";
        message.textContent =
            "Your payment has been verified. Your package purchase has been recorded.";
        
        dashboardLink.classList.remove("hidden");
        loader.classList.add("hidden");

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 3000);

    } catch (error) {
        showError(
            error.message || "Something went wrong while verifying your payment."
        );
    }
}

verifyPayment();
</script></body>
</html>
