<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b20">
<title>Confirming Account | Fundora</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080b20;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}
.card{
    width:90%;
    max-width:380px;
    padding:35px 25px;
    background:#121b35;
    border:1px solid #293858;
    border-radius:18px;
}
h2{font-size:22px}
p{color:#aab4d0;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
    <h2 id="heading">Confirming your account...</h2>
    <p id="message">Please wait while we verify your email address.</p>
</div><script type="module">
import { supabase } from "./supabase.js";

const heading = document.getElementById("heading");
const message = document.getElementById("message");

async function confirmAccount() {
    try {
        const params = new URLSearchParams(window.location.search);
        const tokenHash = params.get("token_hash");
        const type = params.get("type");

        if (tokenHash && type === "signup") {
            const { error } = await supabase.auth.verifyOtp({
                token_hash: tokenHash,
                type: "signup"
            });

            if (error) throw error;
        }

        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (data.session) {
            heading.textContent = "Email confirmed!";
            message.textContent = "Your account is ready. Opening your dashboard...";

            setTimeout(() => {
                window.location.replace("dashboard.html");
            }, 1200);

            return;
        }

        throw new Error("Confirmation completed, but no login session was found. Please log in.");

    } catch (error) {
        heading.textContent = "Confirmation issue";
        message.textContent = error.message || "We could not confirm your email. Please try again or log in.";
    }
}

confirmAccount();
</script></body>
</html>
