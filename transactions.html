<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History | Fundora</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#080b18;
    --card:#11172a;
    --purple:#8057f5;
    --blue:#3985ff;
    --text:#f5f6ff;
    --muted:#929bb5;
    --border:rgba(255,255,255,.08);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

header {
    height:70px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0b1020;
    border-bottom:1px solid var(--border);
}

.brand {
    display:flex;
    align-items:center;
    gap:9px;
    font-size:20px;
    font-weight:800;
}

.brand img {
    width:36px;
    height:36px;
    object-fit:contain;
}

.header-link {
    color:#b49cff;
    text-decoration:none;
    font-size:13px;
}

main {
    width:min(850px,92%);
    margin:30px auto;
}

.heading {
    margin-bottom:25px;
}

.heading h1 {
    font-size:25px;
    margin-bottom:7px;
}

.heading p {
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

.summary {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:28px;
}

.summary-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
}

.summary-card span {
    color:var(--muted);
    font-size:12px;
}

.summary-card h2 {
    font-size:23px;
    margin-top:9px;
}

.section-title {
    font-size:17px;
    margin-bottom:15px;
}

.filters {
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:12px;
    margin-bottom:15px;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar {
    display:none;
}

.filter-btn {
    flex-shrink:0;
    border:1px solid #292e45;
    background:#11172a;
    color:var(--muted);
    padding:9px 15px;
    border-radius:22px;
    font-size:11px;
    font-family:inherit;
    cursor:pointer;
}

.filter-btn.active {
    background:linear-gradient(100deg,var(--purple),var(--blue));
    border-color:transparent;
    color:white;
    font-weight:700;
}

.transaction-list {
    display:flex;
    flex-direction:column;
    gap:12px;
}

.transaction-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.transaction-left {
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.transaction-icon {
    width:43px;
    height:43px;
    border-radius:12px;
    background:#292044;
    display:grid;
    place-items:center;
    font-size:20px;
    flex-shrink:0;
}

.transaction-info {
    min-width:0;
}

.transaction-info h3 {
    font-size:13px;
    margin-bottom:5px;
}

.transaction-info p {
    color:var(--muted);
    font-size:10px;
    line-height:1.6;
    overflow-wrap:anywhere;
}

.transaction-right {
    text-align:right;
    flex-shrink:0;
}

.amount {
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
}

.status {
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:700;
}

.success {
    color:#63dfa2;
    background:rgba(53,190,125,.12);
}

.pending {
    color:#f3c56b;
    background:rgba(243,197,107,.12);
}

.failed {
    color:#ff8585;
    background:rgba(255,100,100,.12);
}

.empty {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:45px 20px;
    text-align:center;
}

.empty-icon {
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:20px;
    background:#292044;
    display:grid;
    place-items:center;
    font-size:32px;
}

.empty h2 {
    font-size:17px;
    margin-bottom:9px;
}

.empty p {
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
    max-width:310px;
    margin:auto;
}

.bottom-nav {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#101629;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:10;
}

.bottom-nav a {
    color:var(--muted);
    text-decoration:none;
    text-align:center;
    font-size:10px;
}

.bottom-nav a span {
    display:block;
    font-size:19px;
    margin-bottom:4px;
}

.bottom-nav a.active {
    color:#b49cff;
}

@media(max-width:400px) {
    main {
        width:91%;
        margin:24px auto;
    }

    .heading h1 {
        font-size:22px;
    }

    .summary-card {
        padding:14px;
    }

    .summary-card h2 {
        font-size:20px;
    }

    .transaction-card {
        padding:13px 11px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="fundora-logo.png" alt="Fundora">
        <span>Fundora</span>
    </div>

    <a href="dashboard.html" class="header-link">Dashboard</a>
</header>

<main>

    <section class="heading">
        <h1>Transaction History</h1>
        <p>View and track your account transactions.</p>
    </section>

    <section class="summary">

        <div class="summary-card">
            <span>Total Transactions</span>
            <h2 id="totalCount">0</h2>
        </div>

        <div class="summary-card">
            <span>Successful Transactions</span>
            <h2 id="successCount">0</h2>
        </div>

    </section>

    <h2 class="section-title">All Transactions</h2>

    <div class="filters">

        <button class="filter-btn active" data-filter="all">All</button>

        <button class="filter-btn" data-filter="purchase">Purchases</button>

        <button class="filter-btn" data-filter="topup">Top Ups</button>

        <button class="filter-btn" data-filter="withdrawal">Withdrawals</button>

        <button class="filter-btn" data-filter="referral">Referral Bonuses</button>

    </div>

    <section class="transaction-list" id="transactionList">

        <div class="empty">
            <div class="empty-icon">🧾</div>
            <h2>Loading Transactions</h2>
            <p>Please wait while we retrieve your records.</p>
        </div>

    </section>

</main>

<nav class="bottom-nav">

    <a href="dashboard.html">
        <span>⌂</span>
        Home
    </a>

    <a href="packages.html">
        <span>▦</span>
        Packages
    </a>

    <a href="investments.html">
        <span>◈</span>
        Investments
    </a>

    <a href="transactions.html" class="active">
        <span>▤</span>
        History
    </a>

</nav>

<script type="module">

import { supabase } from "./supabase.js";

const transactionList =
    document.getElementById("transactionList");

const totalCount =
    document.getElementById("totalCount");

const successCount =
    document.getElementById("successCount");

const filterButtons =
    document.querySelectorAll(".filter-btn");

let transactions = [];

function formatMoney(amount) {

    return new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 2
    }).format(Number(amount || 0));

}

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));

}

function getStatusClass(status) {

    const value = String(status || "").toLowerCase();

    if (["successful", "success", "paid", "approved"].includes(value)) {
        return "success";
    }

    if (["pending", "processing"].includes(value)) {
        return "pending";
    }

    return "failed";

}

function getStatusLabel(status) {

    const value = String(status || "Unknown");

    return value.charAt(0).toUpperCase() + value.slice(1);

}

function formatDate(date) {

    if (!date) return "Date unavailable";

    const parsed = new Date(date);

    if (isNaN(parsed.getTime())) return "Date unavailable";

    return parsed.toLocaleString("en-NG", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });

}

function displayTransactions(filter = "all") {

    const filtered = filter === "all"
        ? transactions
        : transactions.filter(item => item.type === filter);

    if (filtered.length === 0) {

        const messages = {
            all: [
                "No Transactions Yet",
                "Your account transactions will appear here."
            ],

            purchase: [
                "No Purchases Yet",
                "Your package purchases will appear here."
            ],

            topup: [
                "No Top Ups Yet",
                "Your verified top-ups will appear here."
            ],

            withdrawal: [
                "No Withdrawals Yet",
                "Your withdrawal records will appear here."
            ],

            referral: [
                "No Referral Bonuses Yet",
                "Your referral bonuses will appear here."
            ]
        };

        const message = messages[filter] || messages.all;

        transactionList.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🧾</div>
                <h2>${message[0]}</h2>
                <p>${message[1]}</p>
            </div>
        `;

        return;

    }

    const icons = {
        purchase: "📦",
        topup: "💳",
        withdrawal: "🏦",
        referral: "🎁"
    };

    transactionList.innerHTML = filtered.map(item => {

        return `
            <article class="transaction-card">

                <div class="transaction-left">

                    <div class="transaction-icon">
                        ${icons[item.type] || "🧾"}
                    </div>

                    <div class="transaction-info">

                        <h3>${escapeHTML(item.title)}</h3>

                        <p>
                            ${escapeHTML(formatDate(item.date))}
                            <br>
                            Ref: ${escapeHTML(item.reference || "Not available")}
                        </p>

                    </div>

                </div>

                <div class="transaction-right">

                    <div class="amount">
                        ${formatMoney(item.amount)}
                    </div>

                    <span class="status ${getStatusClass(item.status)}">
                        ${escapeHTML(getStatusLabel(item.status))}
                    </span>

                </div>

            </article>
        `;

    }).join("");

}

async function loadTransactions() {

    transactionList.innerHTML = `
        <div class="empty">
            <h2>Loading Transactions...</h2>
            <p>Please wait.</p>
        </div>
    `;

    const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    const user = sessionData.session?.user;

    if (!user) {
        window.location.replace("login.html");
        return;
    }

    const [purchaseResult, walletResult] = await Promise.all([

        supabase
            .from("package_purchases")
            .select(`
                id,
                amount_ngn,
                payment_status,
                purchased_at,
                payment_reference,
                affiliate_packages(name)
            `)
            .eq("user_id", user.id)
            .order("purchased_at", { ascending: false }),

        supabase
            .from("wallet_transactions")
            .select(`
                id,
                amount_ngn,
                transaction_type,
                status,
                description,
                created_at
            `)
            .eq("user_id", user.id)
            .order("created_at", { ascending: false })

    ]);

    if (purchaseResult.error) {
        throw purchaseResult.error;
    }

    if (walletResult.error) {
        throw walletResult.error;
    }

    // Package purchases

    const purchases = (purchaseResult.data || []).map(row => ({

        id: "purchase-" + row.id,

        type: "purchase",

        title:
            (row.affiliate_packages?.name || "Package") +
            " Package Purchase",

        amount: row.amount_ngn,

        status: row.payment_status,

        date: row.purchased_at,

        reference: row.payment_reference

    }));

    // Wallet transactions

    const walletTransactions = (walletResult.data || []).map(row => {

        const rawType =
            String(row.transaction_type || "").toLowerCase();

        let type = "other";

        if (rawType.includes("withdraw")) {

            type = "withdrawal";

        } else if (
            rawType.includes("topup") ||
            rawType.includes("top_up") ||
            rawType.includes("deposit")
        ) {

            type = "topup";

        } else if (
            rawType.includes("referral") ||
            rawType.includes("commission") ||
            rawType.includes("bonus")
        ) {

            type = "referral";

        }

        return {

            id: "wallet-" + row.id,

            type,

            title: row.description ||
                rawType.replaceAll("_", " ") ||
                "Wallet Transaction",

            amount: row.amount_ngn,

            status: row.status,

            date: row.created_at,

            reference: row.id

        };

    });

    transactions = [
        ...purchases,
        ...walletTransactions
    ].sort((a, b) =>
        new Date(b.date || 0).getTime() -
        new Date(a.date || 0).getTime()
    );

    totalCount.textContent = transactions.length;

    successCount.textContent = transactions.filter(item =>
        ["successful", "success", "paid", "approved"].includes(
            String(item.status || "").toLowerCase()
        )
    ).length;

    displayTransactions("all");

}

// Filter buttons

filterButtons.forEach(button => {

    button.addEventListener("click", () => {

        filterButtons.forEach(item =>
            item.classList.remove("active")
        );

        button.classList.add("active");

        displayTransactions(button.dataset.filter);

    });

});

// Load records

loadTransactions().catch(error => {

    console.error("Transaction history error:", error);

    transactionList.innerHTML = `
        <div class="empty">
            <div class="empty-icon">⚠️</div>
            <h2>Couldn't Load Transactions</h2>
            <p>${escapeHTML(error.message || "Please refresh and try again.")}</p>
        </div>
    `;

});

</script>

<script src="shared-menu.js"></script>

</body>
</html>
